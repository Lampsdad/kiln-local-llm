name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every shell script
        run: |
          status=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done < <(git ls-files '*.sh')
          exit $status

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # --external-sources lets it follow the sourced lib_*.sh files
          shellcheck --severity=error --external-sources $(git ls-files '*.sh')

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Byte-compile every Python script
        run: python3 -m py_compile $(git ls-files '*.py')

      # hardware.py is the model registry every launch reads; these pin
      # that families never share a file in models/, that Gemma stays
      # opt-in, and the context numbers the docs quote.
      - name: hardware registry
        run: python3 .github/scripts/test_hardware.py

      # kiln opencode edits a config file other tools depend on; these
      # pin that it refuses rather than writing something broken.
      - name: kiln opencode
        run: python3 .github/scripts/test_opencode.py

      # kiln pi edits pi's models.json, which pi rejects whole when any
      # part breaks its schema; these check every write against it.
      - name: kiln pi
        run: python3 .github/scripts/test_pi.py

      # Linux and WSL setup pick a llama.cpp build from nvidia-smi; these
      # pin that an NVIDIA card gets CUDA under both header wordings.
      - name: llama.cpp build choice
        run: python3 .github/scripts/test_nvidia_smi.py

      # kiln self-update rewrites the user's checkout; these pin that it
      # refuses rather than discard a local edit or a local commit.
      - name: kiln self-update
        run: python3 .github/scripts/test_selfupdate.py

      # kiln tui and the benchmark run kiln verbs; these pin that only
      # the fixed table reaches a command line, and that a benchmark
      # never opens a tunnel and always frees the GPU.
      - name: control
        run: python3 .github/scripts/test_control.py

      - name: benchmark
        run: python3 .github/scripts/test_bench.py

      # kiln path writes into ~/.local/bin; these pin that it never
      # replaces or deletes a kiln some other tool put there.
      - name: kiln path
        run: python3 .github/scripts/test_path.py

  tui:
    name: kiln tui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not the runner's system Python: PEP 668 refuses a pip install
      # into it, which is also why kiln tui keeps Textual in a venv.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Textual, at the version tui.py asks for
        run: |
          req=$(python -c "import sys; sys.path.insert(0, 'scripts'); import tui; print(tui.REQUIREMENT)")
          python -m pip install "$req"

      - name: kiln tui
        run: python .github/scripts/test_tui.py

  line-endings:
    name: Line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A .sh checked out with CRLF dies on Linux with "\r: command not
      # found"; a .bat with LF can misbehave under cmd.exe. .gitattributes
      # pins both -- this proves the pinning still holds after a checkout.
      - name: .sh must be LF, .bat and .ps1 must be CRLF
        run: |
          status=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "FAIL $f contains CR -- must be LF only"
              status=1
            fi
          done < <(git ls-files '*.sh')
          while IFS= read -r f; do
            if ! grep -qU $'\r' "$f"; then
              echo "FAIL $f has no CR -- must be CRLF"
              status=1
            fi
          done < <(git ls-files '*.bat' '*.ps1')
          if [ $status -eq 0 ]; then echo "All line endings correct"; fi
          exit $status

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Weights, binaries, logs and the generated key must never be
      # committed. .gitignore covers them; this catches a `git add -f`.
      - name: No secrets, weights, binaries or logs are tracked
        run: |
          status=0
          while IFS= read -r f; do
            case "$f" in
              api_key.txt|*.gguf|*.dat|*.log|*.exe|*.dll|*.zip|llama-bin/*|models/*)
                echo "FAIL $f must not be tracked"
                status=1
                ;;
            esac
          done < <(git ls-files)
          if [ $status -eq 0 ]; then echo "Nothing forbidden is tracked"; fi
          exit $status

      - name: No stray control characters in scripts
        run: python3 .github/scripts/check_control_chars.py

      # Catches docs that still tell users to run a renamed or deleted
      # script. Compared by basename so \ and / both work.
      - name: Every script named in the docs exists
        run: |
          git ls-files '*.bat' '*.sh' '*.ps1' | xargs -n1 basename | sort -u > /tmp/have
          # URLs are stripped first so img.shields.io does not read as a
          # script named img.sh; foo.bat is CONTRIBUTING's placeholder.
          # CHANGELOG.md is excluded: it names the files it removed.
          cat README.md CONTRIBUTING.md SECURITY.md NOTES.md \
            | sed 's|https[^ )]*||g' \
            | grep -oE '[A-Za-z0-9_.-]+[.](bat|sh|ps1)' \
            | grep -vxE 'foo[.]bat|dp0foo[.]bat' \
            | sort -u > /tmp/want
          missing=$(comm -13 /tmp/have /tmp/want || true)
          if [ -n "$missing" ]; then
            echo "FAIL docs reference scripts that do not exist:"
            echo "$missing"
            exit 1
          fi
          echo "Every script named in the docs exists"
